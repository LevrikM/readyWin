name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version used in the file name (for example 1.2.0)'
        required: false
        default: 'dev'

permissions:
  actions: read
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Resolve version
        id: meta
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if ('${{ github.ref_type }}' -eq 'tag') { $version = '${{ github.ref_name }}' -replace '^v', '' }
          if ([string]::IsNullOrWhiteSpace($version)) { $version = 'dev' }
          "version=$version" >> $env:GITHUB_OUTPUT
          $config = Get-Content wails.json -Raw | ConvertFrom-Json
          $config.info.productVersion = $version
          $config | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8

      - name: Build
        shell: pwsh
        run: wails build -clean -platform windows/amd64 -ldflags "-X main.appVersion=${{ steps.meta.outputs.version }}"

      - name: Copy executable
        shell: pwsh
        run: Copy-Item build/bin/ReadyWin.exe 'ReadyWin.exe' -Force

      - name: Upload unsigned executable
        id: unsigned
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != '' && env.SIGNPATH_PROJECT_SLUG != '' && env.SIGNPATH_SIGNING_POLICY_SLUG != ''
        uses: actions/upload-artifact@v4
        with:
          name: ReadyWin-${{ steps.meta.outputs.version }}-unsigned
          path: ReadyWin.exe
          archive: false
          if-no-files-found: error

      - name: Sign with SignPath
        id: signpath
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          skip-decompress: true
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Verify signature
        if: steps.signpath.outcome == 'success'
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path signed -Filter ReadyWin.exe -Recurse | Select-Object -First 1
          if (-not $signed) { throw 'SignPath did not return ReadyWin.exe' }
          Copy-Item $signed.FullName 'ReadyWin.exe' -Force
          $signature = Get-AuthenticodeSignature 'ReadyWin.exe'
          if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($signature.Status)" }
          $signature.SignerCertificate.Subject

      - name: Package and checksums
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $zip = "ReadyWin-$version-windows-amd64.zip"
          $exeHash = (Get-FileHash 'ReadyWin.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$exeHash  ReadyWin.exe" | Set-Content 'ReadyWin.exe.sha256' -Encoding ascii
          Compress-Archive -Path 'ReadyWin.exe' -DestinationPath $zip -Force
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $zip" | Set-Content "$zip.sha256" -Encoding ascii
          Get-ChildItem 'ReadyWin*' | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReadyWin-windows-amd64
          path: |
            ReadyWin.exe
            ReadyWin.exe.sha256
            ReadyWin-*-windows-amd64.zip
            ReadyWin-*-windows-amd64.zip.sha256
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ReadyWin.exe
            ReadyWin.exe.sha256
            ReadyWin-*-windows-amd64.zip
            ReadyWin-*-windows-amd64.zip.sha256
          generate_release_notes: true
