name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go і фронтенд
    runs-on: windows-latest
    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Перевірити узгодженість версії
        shell: pwsh
        run: |
          $app = (Select-String -Path app.go -Pattern 'var appVersion = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $wails = (Get-Content wails.json -Raw | ConvertFrom-Json).info.productVersion
          $package = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          if ($app -ne $wails -or $wails -ne $package) {
            throw "Версії не збігаються: app.go=$app wails.json=$wails frontend/package.json=$package"
          }
          Write-Output "Version $app"

      - name: Залежності та збірка фронтенду
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test ./...
